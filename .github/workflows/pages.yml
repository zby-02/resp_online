
name: Deploy main and research

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Checkout research
        uses: actions/checkout@v4
        with:
          ref: research
          path: research-site

      - name: Assemble site
        run: |
          mkdir -p site/research
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            main-site/ site/
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            research-site/ site/research/
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
